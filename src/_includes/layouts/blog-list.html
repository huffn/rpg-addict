{% extends "layouts/base.html" %}
{% block body %}
<main id="main" class="container plain-layout">
  <h1 class="page-title">Blog</h1>
  <ul class="post-rows">
    {% for post in collections.blogPosts %}
    <li data-campaign="{{ post.data.currentCampaign.key if post.data.currentCampaign else 'fu' }}"><a class="post-row blip" href="{{ post.url }}"><span class="post-row-title">{{ post.data.title }}</span><time datetime="{{ post.date | luxonDate('yyyy-MM-dd') }}">{{ post.date | luxonDate('LLLL d, yyyy') }}</time></a></li>
    {% endfor %}
  </ul>
</main>
{% endblock %}
