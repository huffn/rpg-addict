{% extends "layouts/base.html" %}
{% block body %}
<main id="main" class="container plain-layout">
  <div class="panel panel--float title-panel">
    {% if kicker %}<span class="kicker">{{ kicker }}</span>{% endif %}
    <h1 class="page-title">{{ title }}</h1>
    {% if date %}<div class="chips"><time class="chip" datetime="{{ date | luxonDate('yyyy-MM-dd') }}">{{ date | luxonDate('LLLL d, yyyy') }}</time></div>{% endif %}
  </div>
  <article class="prose">
    {{ content | enhance | safe }}
  </article>
</main>
{% endblock %}
